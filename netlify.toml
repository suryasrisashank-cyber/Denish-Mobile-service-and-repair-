"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit"

[functions]
  external_node_modules = ["better-sqlite3"]
  included_files = ["node_modules/better-sqlite3/build/Release/*.node", "src/data/schema.sql"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

